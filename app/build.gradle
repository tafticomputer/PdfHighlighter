plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pdfhighlighter'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.pdfhighlighter'
        minSdk 21          // اندروید 5.0 و 5.1
        targetSdk 33
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'UTF-8'
    }
}

// نمایش PDF: android.graphics.pdf.PdfRenderer (جزو خود اندروید از نسخه 5.0)
// نوشتن هایلایت داخل فایل PDF: کلاس PdfInk (بدون کتابخانه‌ی خارجی)
dependencies {
}
